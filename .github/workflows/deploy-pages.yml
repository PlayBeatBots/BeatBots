name: Deploy site to Cloudflare Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: playbeatbots
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Settings → Secrets and variables → Actions to enable deploys."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Safety check — only public site files get published
        if: steps.secrets.outputs.ready == 'true'
        run: |
          test -f site/index.html && test -f site/beatbots-mint.js
          if find site \( -name '*.json' -o -name '*keypair*' -o -name '*.pem' -o -name '.env*' \) | grep -q .; then
            echo "::error::site/ contains JSON/keypair/env files. Refusing to publish."; exit 1
          fi

      - name: Create Pages project (first run only)
        if: steps.secrets.outputs.ready == 'true'
        run: npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=main || echo "Project already exists."

      - name: Deploy site/
        if: steps.secrets.outputs.ready == 'true'
        run: npx --yes wrangler@4 pages deploy site --project-name="$PROJECT" --branch=main --commit-dirty=true
